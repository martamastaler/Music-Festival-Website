<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Tickets </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <a href="indexcf.html">Home Page</a>
        <a href="lineupcf.html">Artists Lineup</a>
        <a href="ticketscf.html">Tickets</a>
        <a href="schedulecf.html">Schedule</a>
    </nav>
</header>

<div class="top-text">
    <h1>Booking Form</h1>
    <p>Please fill in the details below.</p>
</div>

<div class="form-container">

    <form onsubmit="return validateForm()">

    <label>Full Name *</label>
    <input type="text" id="name" placeholder="Enter your full name">

    <label>Email Address *</label>
    <input type="text" id="email" placeholder="Enter your email">

    <label>Phone Number *</label>
    <input type="text" id="phone" placeholder="Enter your phone number">

    <label>Number of Tickets *</label>
    <input type="number" min="1" max="10" required>

    <p id="error-msg" style="color:red;"></p>
    <p id="success-msg" style="color:green;"></p>

    <div class="buttons">
        <button type="submit" class="submit-btn">Submit</button>
        <button type="reset" class="reset-btn">Reset</button>
    </div>

    </form>
</div>
<script>
function validateForm() {

    // get values
    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var phone = document.getElementById("phone").value.trim();

    var errorMsg = document.getElementById("error-msg");
    var successMsg = document.getElementById("success-msg");

    errorMsg.textContent = "";
    successMsg.textContent = "";

    // required fields
    if (name === "" || email === "" || phone === "") {
        errorMsg.textContent = "Please fill in all required fields.";
        return false;
    }

    // email validation
    var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        errorMsg.textContent = "Please enter a valid email address.";
        return false;
    }

    // phone validation (basic)
    var phonePattern = /^[0-9]{10,15}$/;
    if (!phonePattern.test(phone)) {
        errorMsg.textContent = "Please enter a valid phone number.";
        return false;
    }

    // success
    successMsg.textContent = "Form submitted successfully!";
    return false; // keep false so page doesn't reload
}
</script>
</body>
</html>
